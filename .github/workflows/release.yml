name: release

# vX.X.X tag'i push edilince o sürüm için GitHub Release oluşturur
# (linux amd64 / arm64 / armv7 statik binary'leri + SHA256SUMS).
#
# Kullanım:
#   git tag v0.1.0
#   git push origin v0.1.0
# → GitHub'da Actions çalışır, Releases altında v0.1.0 + ikili dosyalar belirir.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (linux amd64 / arm64 / armv7)
        run: |
          set -eu
          mkdir -p dist
          build() {
            os="$1"; arch="$2"; suffix="${3:-}"
            name="panomim-${os}-${arch}${suffix:+-${suffix}}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM="${suffix}" \
              go build -trimpath -ldflags="-s -w" -o "dist/${name}" ./cmd/panomim
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            rm "dist/${name}"
          }
          build linux amd64
          build linux arm64
          build linux arm 7
          cd dist && sha256sum ./*.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
