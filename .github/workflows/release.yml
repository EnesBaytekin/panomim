name: release

# vX.X.X tag'i push edilince o sürüm için GitHub Release oluşturur:
# bare statik binary'ler (amd64/arm64/armv7) + install.sh + SHA256SUMS.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (linux amd64 / arm64 / armv7)
        run: |
          set -eu
          mkdir -p dist
          build() {
            os="$1"; arch="$2"; goarm="$3"; out="$4"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM="$goarm" \
              go build -trimpath -ldflags="-s -w" -o "dist/$out" ./cmd/panomim
          }
          build linux amd64 "" panomim-linux-amd64
          build linux arm64 "" panomim-linux-arm64
          build linux arm 7 panomim-linux-armv7
          cp scripts/install.sh dist/install.sh
          chmod +x dist/install.sh
          cd dist && sha256sum panomim-linux-* > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/panomim-linux-*
            dist/install.sh
            dist/SHA256SUMS
          body: |
            ## Kurulum

            Tek komutla kur (mimari otomatik tespit edilir):

            ```bash
            curl -fsSL https://github.com/EnesBaytekin/panomim/releases/download/${{ github.ref_name }}/install.sh -o install.sh
            sudo bash install.sh <alan-adiniz>   # Let's Encrypt HTTPS (443)
            ```

            Domain'siz, sadece IP:port ile (self-signed HTTPS) kurmak için:

            ```bash
            sudo bash install.sh   # → https://<sunucu-ip>:8443
            ```

            > Alan adı kullanacaksan önce DNS A kaydını ekle ve 80/443 portlarını aç.

            **Güncelleme:** aynı script'i tekrar çalıştır — `sudo bash install.sh <alan-adiniz>`
            yeni sürümü yükler ve servisi yeniden başlatır (veri korunur).

            ### İkili dosyalar

            | Dosya | Hedef |
            |---|---|
            | `panomim-linux-arm64` | ARM 64-bit (aarch64) |
            | `panomim-linux-amd64` | x86_64 |
            | `panomim-linux-armv7` | ARM 32-bit |
            | `SHA256SUMS` | bütünlük kontrolü |
