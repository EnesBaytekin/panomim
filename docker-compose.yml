services:
  todoer:
    build: .
    image: todoer:latest
    ports:
      - "8443:8443"
    volumes:
      # isimli volume ilk kullanımda doğru sahiplikle (nonroot) oluşur;
      # bind-mount tercih ederseniz dizini 65532 uid'sine açın: chown 65532 ./data
      - todoer-data:/data
    restart: unless-stopped
    environment:
      # Değerler proje kökündeki .env dosyasından gelir (yoksa buradaki varsayılanlar).
      # Tüm seçenekler için bkz. .env.example ve KURULUM.md
      TODOER_ADDR: ${TODOER_ADDR:-:8443}
      TODOER_DATA: /data
      TODOER_HTTP: ${TODOER_HTTP:-true}
      TODOER_HTTPS_DOMAIN: ${TODOER_HTTPS_DOMAIN:-}
      TODOER_CERT: ${TODOER_CERT:-}
      TODOER_KEY: ${TODOER_KEY:-}

volumes:
  todoer-data:
